name: Build APK from Vercel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Download Vercel build
        run: |
          # Download the Vercel build output (adjust URL as needed)
          curl -L -o vercel-build.zip https://reial-network.vercel.app/_next/static/...

      - name: Copy web assets to Capacitor
        run: |
          npx cap add android
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheki-App
          path: android/app/build/outputs/apk/debug/*.apk
